<body>
<main class="shell" id="app"></main>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<script>
/* SCHEDULE_STATE */
const icons = {
  install:'<path d="M8 8H5v13h14V8h-3M12 15V2m-4 4 4-4 4 4"/>',
  power:'<path d="M12 2v9M6.3 5.8a8 8 0 1 0 11.4 0"/>',
  clock:'<circle cx="12" cy="12" r="7.5"/><path d="M12 7v5l3 2M12 1v1M12 22v1M1 12h1m20 0h1M4.2 4.2l.8.8m14 14 .8.8M4.2 19.8l.8-.8m14-14 .8-.8"/>',
  refresh:'<path d="M20 7v5h-5M4 17v-5h5M5.4 8a7 7 0 0 1 11.5-3L20 8M4 16l3.1 3A7 7 0 0 0 18.6 16"/>',
  arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',
  check:'<path d="m5 12 4 4L19 6"/>',
  bolt:'<path d="m13 2-8 12h7l-1 8 8-12h-7z"/>',
  heart:'<path d="M20.8 8.6c0 4.1-8.8 9.3-8.8 9.3s-8.8-5.2-8.8-9.3a4.4 4.4 0 0 1 8.8 0 4.4 4.4 0 0 1 8.8 0Z"/>',
  home:'<path d="m3 11 9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/>',
  pin:'<path d="M19 10c0 5-7 10-7 10s-7-5-7-10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
  moon:'<path d="M20 15A8 8 0 0 1 9 4a8.5 8.5 0 1 0 11 11Z"/>',
  back:'<path d="m15 5-7 7 7 7"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  close:'<path d="m6 6 12 12M18 6 6 18"/>', off:'<path d="m13 2-3 5m5 3h4l-3 5m-3 4-2 3 1-8H5l2-3M3 3l18 18"/>'
};
const icon = name => '<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[name]+'</svg>';
const queues=Array.from({length:12},(_,i)=>Math.floor(i/2+1)+'.'+(i%2+1));
const app=document.querySelector('#app');
const dialog=document.querySelector('#dialog');
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const two=value=>String(value).padStart(2,'0');
const time=value=>two(Math.floor(value/60))+':'+two(value%60);
const savedKey='zvitlo-hoe-addresses-v2';
function readSaved(){try{const value=JSON.parse(localStorage.getItem(savedKey)||'[]');return Array.isArray(value)?value.filter(item=>item&&typeof item.id==='string'&&queues.includes(item.queue)):[]}catch{return []}}
let addresses=readSaved();
let selected=null;
function readScheduleSnapshot(){try{const value=JSON.parse(localStorage.getItem('onmisto-schedule-v1')||'null');return validSchedule(value?.schedule)?value:null}catch{return null}}
const scheduleSnapshot=readScheduleSnapshot();
let schedule=scheduleSnapshot?.schedule||null;
let scheduleFromCache=!!schedule;
let scheduleSaved=!!schedule;
let offlineShellReady=false;
let scheduleChanges=validScheduleChanges(scheduleSnapshot?.changes)?scheduleSnapshot.changes:[];
let scheduleChangedAt=Number.isFinite(Date.parse(scheduleSnapshot?.changedAt))?scheduleSnapshot.changedAt:null;
let selectedDate=null;
let refreshing=false;
let sourceError='';
let pageMode='light';
let fuelData=null;
let fuelIndex=0;
let fuelLoading=false;
let fuelError='';
let airRaidData=null;
let airRaidLoading=false;
let telegramData=null;
let telegramError='';
let telegramLoading=false;
let lookup=null;
const addressData=new Map();
const addressErrors=new Map();
try{
  const saved=JSON.parse(localStorage.getItem('onmisto-address-events-v1')||'{}');
  for(const item of addresses){const data=saved[item.id];if(data&&Array.isArray(data.events)&&data.events.every(event=>['work','type','queue','emergencyQueue','start','end'].every(key=>typeof event[key]==='string'))&&Array.isArray(data.queues)&&data.queues.every(queue=>queues.includes(queue))&&Number.isFinite(Date.parse(data.fetchedAt))){addressData.set(item.id,data);addressErrors.set(item.id,'Збережені дані адреси. Очікуємо перевірку джерела.');}}
}catch{}
let formRevision=0;
let lastMinute='';
let swipeStart=null;
const dateFormat=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit'});
const clockFormat=new Intl.DateTimeFormat('uk-UA',{timeZone:'Europe/Kyiv',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const today=()=>dateFormat.format(new Date());
const nowMinutes=()=>{const [h,m]=clockFormat.format(new Date()).split(':').map(Number);return h*60+m};
const currentLocal=()=>today()+'T'+clockFormat.format(new Date());
function countdown(next){const seconds=new Date().getSeconds();const left=Math.max(0,(next-nowMinutes())*60-seconds);return Math.floor(left/3600)+':'+two(Math.floor(left/60)%60)+':'+two(left%60)}
const dayLabel=date=>new Intl.DateTimeFormat('uk-UA',{day:'numeric',month:'long'}).format(new Date(date+'T12:00:00Z'));
const persist=()=>{try{localStorage.setItem(savedKey,JSON.stringify(addresses))}catch{}};
async function api(path){
  const response=await fetch(path,{signal:AbortSignal.timeout(23000),cache:'no-store'});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'Помилка завантаження даних.');
  return data;
}
function queueOptions(options,value,placeholder=false){return (placeholder?'<option value="">Оберіть підчергу</option>':'')+options.map(queue=>'<option value="'+queue+'" '+(queue===value?'selected':'')+'>'+queue+'</option>').join('')}
function merge(intervals){const result=[];for(const [start,end] of intervals.toSorted((a,b)=>a[0]-b[0])){const prev=result.at(-1);if(prev&&start<=prev[1])prev[1]=Math.max(prev[1],end);else result.push([start,end])}return result}
function dayData(item,date){
  const day=schedule?.days.find(day=>day.date===date);
  const hourly=day?.queues[item.queue];
  if(!hourly)return null;
  const outages=hourly.map(interval=>[...interval]);
  if(item.streetId){
    const data=addressData.get(item.id);
    if(data){
      for(const event of data.events){
        const eventQueues=event.queue.match(/[1-6]\.[12]/g)||[];
        if(eventQueues.length&&!eventQueues.includes(item.queue))continue;
        const start=event.start<date+'T00:00'?0:event.start>date+'T23:59'?1440:Number(event.start.slice(11,13))*60+Number(event.start.slice(14,16));
        const end=event.end<date+'T00:00'?0:event.end>date+'T23:59'?1440:Number(event.end.slice(11,13))*60+Number(event.end.slice(14,16));
        if(end>start)outages.push([start,end]);
      }
    }
  }
  return merge(outages);
}
function dayOnPeriods(outages){let start=0;const periods=[];for(const [from,to] of outages){if(from>start)periods.push([start,from]);start=to}if(start<1440)periods.push([start,1440]);return periods}
function status(item){
  if(!schedule)return {label:sourceError?'Дані тимчасово недоступні':'Завантажуємо графік',lit:false,next:null};
  const outages=dayData(item,today());
  if(!outages)return {label:'Графік на сьогодні ще не опублікований',lit:false,next:null};
  const minute=nowMinutes();
  const active=outages.find(([from,to])=>from<=minute&&minute<to);
  const next=active?active[1]:outages.find(([from])=>from>minute)?.[0];
  return {label:active?'За графіком відключення':'За графіком є світло',lit:!active,next,off:!!active};
}
function addressLabel(item){return '<div class="address"><span class="badge">'+icon(item.streetId?'home':'bolt')+'</span><span><strong class="address-name">'+escapeHtml(item.name)+'</strong><span class="sub">'+(item.streetId?escapeHtml(item.streetText)+', '+escapeHtml(item.house):'Хмельницька область')+'</span></span></div>'}
function timeline(item,date){
  const outages=dayData(item,date);
  if(!outages)return '<p class="muted">'+(!schedule&&!sourceError?'Завантаження графіка…':'Погодинний графік за цю дату відсутній')+'</p>';
  const periods=dayOnPeriods(outages).map(([from,to])=>'<span class="period" style="left:'+(from/1440*100)+'%;width:'+((to-from)/1440*100)+'%"></span>').join('');
  const marker=date===today()?'<span class="marker" style="left:'+(nowMinutes()/1440*100)+'%"></span>':'';
  return '<div class="timeline" aria-hidden="true"><span class="track" style="width:100%"></span>'+periods+marker+'<span class="tick" style="left:4%">00:00</span><span class="tick" style="left:50%">12:00</span><span class="tick" style="left:96%">24:00</span></div>';
}
function changeLabel(current){
  if(current.next===1440)return 'До кінця графіка на сьогодні';
  return current.off?'До ввімкнення за графіком':'До відключення за графіком';
}
function card(item){
  const current=status(item);
  const known=dayData(item,today())!==null;
  const warning=addressErrors.get(item.id)?'<p class="sub">Дані будинку не оновлено</p>':'';
  const countdownText=current.next!=null?'<span class="countdown-label">'+changeLabel(current)+'</span><strong class="card-countdown" data-next="'+current.next+'">'+countdown(current.next)+'</strong>':'<strong class="card-countdown unknown">'+(known?'До кінця доби без змін':sourceError?'Спробуй оновити':'Очікуємо графік')+'</strong>';
  return '<article class="card"><button class="card-main" type="button" data-action="detail" data-id="'+escapeHtml(item.id)+'" aria-label="Графік за адресою '+escapeHtml(item.name)+'"><div class="card-top">'+addressLabel(item)+'<span class="queue-badge">'+item.queue+'</span></div><span class="state-pill '+(known?(current.off?'off':'lit'):'')+'"><i></i>'+current.label+'</span>'+countdownText+warning+timeline(item,today())+'<div class="card-bottom"><span>Погодинний графік</span>'+icon('arrow')+'</div></button></article>';
}

function persistScheduleSnapshot(){
  if(!schedule)return;
  try{localStorage.setItem('onmisto-schedule-v1',JSON.stringify({schedule,changes:scheduleChanges,changedAt:scheduleChangedAt}));scheduleSaved=true}catch{scheduleSaved=false}
}
function persistAddressSnapshots(){
  try{localStorage.setItem('onmisto-address-events-v1',JSON.stringify(Object.fromEntries([...addressData].filter(([id])=>addresses.some(item=>item.id===id)))))}catch{}
}
function savedScheduleTime(){
  return schedule?new Intl.DateTimeFormat('uk-UA',{timeZone:'Europe/Kyiv',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(schedule.fetchedAt)):'';
}
function savedScheduleBanner(){
  if(!schedule)return navigator.onLine?'':'<p class="notice">Без інтернету. Збереженого графіка ще немає.</p>';
  if(!navigator.onLine||scheduleFromCache||sourceError)return '<p class="saved-banner" role="status">'+(!navigator.onLine?'Без інтернету':sourceError?'Не вдалося оновити':'Перевіряю оновлення')+' · збережений графік від '+savedScheduleTime()+'.</p>';
  return '';
}
function relevantScheduleChanges(queue,date){
  return scheduleChanges.filter(change=>(!queue||change.queue===queue)&&(!date||change.date===date)&&change.date>=today());
}
function changesBanner(item){
  const changes=relevantScheduleChanges(item?.queue,item?selectedDate||today():null).filter(change=>item||!addresses.length||addresses.some(address=>address.queue===change.queue));

function hourCell(hour,outages,date,queue){
  const start=hour*60,end=start+60;
  const off=outages.reduce((sum,[from,to])=>sum+Math.max(0,Math.min(end,to)-Math.max(start,from)),0);
  const state=off===0?'on':off===60?'off':'partial';
  const changed=relevantScheduleChanges(queue,date).some(change=>change.intervals.some(i=>i.start<end&&i.end>start));
  const current=date===today()&&Math.floor(nowMinutes()/60)===hour;
  const past=date<today()||(date===today()&&hour<Math.floor(nowMinutes()/60));
  return '<span class="hour '+state+(past?' past':'')+(current?' now':'')+(changed?' changed':'')+'" aria-label="'+time(start)+', '+(state==='on'?'за графіком є світло':state==='off'?'відключення':'часткове відключення')+(current?', зараз':'')+(changed?', графік змінено':'')+'">'+(state==='partial'?'':icon(state==='on'?'bolt':'off'))+time(start)+'</span>';
}

  const options=addressData.get(item.id)?.queues;
  const header='<header><button class="icon-button" type="button" data-action="back" aria-label="До списку адрес">'+icon('back')+'</button><div class="detail-nav"><span class="brand-name">onmisto</span><span class="brand-region">Графік твого дня</span></div><button class="icon-button theme" type="button" data-action="theme" aria-label="Змінити тему">'+icon(document.documentElement.dataset.theme==='light'?'moon':'sun')+'</button></header>';
  const tabs=addresses.length>1?'<nav class="address-tabs" aria-label="Перемкнути адресу">'+addresses.map(address=>'<button class="address-tab" type="button" data-action="detail" data-id="'+escapeHtml(address.id)+'" aria-current="'+(address.id===item.id)+'">'+escapeHtml(address.name)+'</button>').join('')+'</nav>':'';
  const heading='<div class="detail-heading"><div><p class="eyebrow">Моя адреса</p><h1>'+escapeHtml(item.name)+'</h1><span class="sub">'+(item.streetId?escapeHtml(item.streetText)+', '+escapeHtml(item.house):'Хмельницька область')+'</span></div><span class="queue-badge">Підчерга '+item.queue+'</span></div>';
  const settings='<section class="settings-section"><h2 class="section-title">Налаштування адреси</h2><div class="glass"><label class="row">Назва<input aria-label="Назва адреси" data-field="name" maxlength="60" value="'+escapeHtml(item.name)+'"></label><div class="row"><span>Оператор</span><span>Хмельницькобленерго</span></div><label class="row">Підчерга<select data-field="queue">'+queueOptions(options?.length?[...new Set([item.queue,...options])]:queues,item.queue)+'</select></label>'+(item.streetId?'<p class="sub">'+escapeHtml(item.settlementText)+', '+escapeHtml(item.streetText)+', '+escapeHtml(item.house)+'</p>':'')+'</div><p class="muted">'+(item.streetId?'У сітці враховано відключення обраного приєднання.':'Для перевірки аварійних і планових робіт додай адресу будинку.')+'</p><button class="danger" type="button" data-action="remove" data-id="'+escapeHtml(item.id)+'">Видалити адресу</button></section>';
  return header+savedScheduleBanner()+changesBanner(item)+tabs+heading+transitionPanel(item)+'<section class="schedule-section" aria-label="Графік світла"><h2 class="section-title">Графік на день</h2>'+dateTabs+summary+hours+'</section>'+eventList(item)+settings+'<footer>'+sourceInfo()+'<p class="footer-note">Час за Києвом. Фактичне живлення може відрізнятися від графіка.</p></footer>';
}
function render(){
  const item=addresses.find(item=>item.id===selected);
  const focused=document.activeElement;
  const editing=focused?.matches('#app input[data-field]')?{field:focused.dataset.field,value:focused.value,start:focused.selectionStart,end:focused.selectionEnd}:null;
  app.classList.toggle('is-detail',!!item);
  document.querySelector('meta[name=theme-color]').content=document.documentElement.dataset.theme==='light'?'#f5f5ef':'#101d24';
  app.innerHTML=item?detail(item):home();
  if(editing){
    const input=app.querySelector('input[data-field="'+editing.field+'"]');
    if(input){input.value=editing.value;input.focus({preventScroll:true});input.setSelectionRange(editing.start,editing.end)}
  }
}
function showAddress(id){selected=id;selectedDate=today();render();window.scrollTo(0,0)}
function openDialog(title,body){formRevision++;lookup=null;dialog.innerHTML='<div class="dialog-head"><h2 id="dialog-title">'+title+'</h2><button class="icon-button" type="button" data-action="close" aria-label="Закрити">'+icon('close')+'</button></div>'+body;dialog.showModal()}
function openAddress(){
  openDialog('Додати адресу','<form class="form" id="address-form"><label class="field">Назва картки (необов’язково)<input name="name" maxlength="60" placeholder="Наприклад, Дім або Робота"></label><label class="field">Населений пункт<input name="settlement" placeholder="Почни вводити назву" autocomplete="off" required></label><div id="settlement-results" class="search-results" role="status"></div><label class="field">Вулиця<input name="street" placeholder="Спочатку обери населений пункт" autocomplete="off" disabled required></label><div id="street-results" class="search-results" role="status"></div><label class="field">Будинок<select name="house" disabled required><option value="">Оберіть вулицю</option></select></label><div id="lookup-result" role="status"></div><p id="form-error" class="notice" hidden></p><button class="wide primary" id="save-address" disabled>Зберегти адресу</button><p class="muted">Або <button type="button" class="text-button" data-action="queue">додай лише підчергу</button>.</p></form>');
}
function form(){return document.querySelector('#address-form')}
function formError(error){const el=document.querySelector('#form-error');if(el){el.hidden=!error;el.textContent=error?.message||''}}
function invalidateLookup(){lookup=null;const save=document.querySelector('#save-address');if(save)save.disabled=true;const result=document.querySelector('#lookup-result');if(result)result.replaceChildren()}
function searchReset(kind){
  const f=form();if(!f)return;
  if(kind==='settlement'){delete f.dataset.settlement;delete f.dataset.settlementText;f.elements.street.value='';f.elements.street.disabled=true;document.querySelector('#street-results').replaceChildren()}
  delete f.dataset.street;delete f.dataset.streetText;f.elements.house.innerHTML='<option value="">Оберіть будинок</option>';f.elements.house.disabled=true;invalidateLookup();
}
let searchTimer;
async function search(kind,input){
  const revision=++formRevision;
  const term=input.value.trim();
  clearTimeout(searchTimer);
  searchReset(kind);formError(null);
  const target=document.querySelector('#'+kind+'-results');target.replaceChildren();
  if(term.length<2)return;
  target.textContent='Пошук…';
  clearTimeout(searchTimer);
  searchTimer=setTimeout(async()=>{
    try{
      const f=form();
      const suffix=kind==='street'?'&settlement='+encodeURIComponent(f.dataset.settlement):'';
      const results=await api('/api/'+(kind==='street'?'streets':'settlements')+'?term='+encodeURIComponent(term)+suffix);
      if(revision!==formRevision||!dialog.open)return;
      target.innerHTML=results.length?results.map(item=>'<button type="button" data-action="choose-'+kind+'" data-id="'+escapeHtml(item.id)+'" data-text="'+escapeHtml(item.text)+'">'+escapeHtml(item.text)+'</button>').join(''):'Нічого не знайдено. Спробуй іншу назву.';
    }catch(error){if(revision===formRevision){target.replaceChildren();formError(error)}}
  },350);
}
async function chooseSettlement(button){
  const f=form();formRevision++;
  f.dataset.settlement=button.dataset.id;f.dataset.settlementText=button.dataset.text;
  f.elements.settlement.value=button.dataset.text;
  document.querySelector('#settlement-results').replaceChildren();
  f.elements.street.disabled=false;f.elements.street.placeholder='Почни вводити назву вулиці';f.elements.street.focus();
}
async function chooseStreet(button){
  const f=form(),revision=++formRevision;
  f.dataset.street=button.dataset.id;f.dataset.streetText=button.dataset.text;f.elements.street.value=button.dataset.text;
  document.querySelector('#street-results').replaceChildren();formError(null);
  f.elements.house.innerHTML='<option value="">Завантаження…</option>';
  try{
    const houses=await api('/api/houses?street='+encodeURIComponent(button.dataset.id));
    if(revision!==formRevision||!dialog.open)return;
    f.elements.house.innerHTML='<option value="">Оберіть будинок</option>'+houses.map(house=>'<option value="'+escapeHtml(house)+'">'+escapeHtml(house)+'</option>').join('');
    f.elements.house.disabled=false;
    if(!houses.length)formError(new Error('У джерелі немає будинків на цій вулиці.'));
  }catch(error){if(revision===formRevision){f.elements.house.innerHTML='<option value="">Не вдалося завантажити</option>';formError(error)}}
}
async function loadHouse(){
  const f=form(),revision=++formRevision;
  invalidateLookup();formError(null);
  if(!f.elements.house.value)return;
  const result=document.querySelector('#lookup-result');result.textContent='Перевіряю чергу та відключення…';
  try{
    const data=await api('/api/address?street='+encodeURIComponent(f.dataset.street)+'&house='+encodeURIComponent(f.elements.house.value));
    if(revision!==formRevision||!dialog.open)return;
    lookup=data;
    result.innerHTML='<label class="field">Підчерга<select name="queue" required>'+queueOptions(data.queues.length?data.queues:queues,data.queues.length===1?data.queues[0]:'',data.queues.length!==1)+'</select></label><p class="muted">'+(data.queues.length>1?'Будинок має кілька приєднань. Обери підчергу своєї квартири.':data.queues.length?'Підчергу визначено на сайті обленерго.':'Джерело не визначило підчергу. Обери її вручну, якщо знаєш.')+'</p>';
    document.querySelector('#save-address').disabled=false;
  }catch(error){if(revision===formRevision){result.replaceChildren();formError(error)}}
}
function openQueue(){openDialog('Стежити за підчергою','<form class="form" id="queue-form"><label class="field">Назва картки (необов’язково)<input name="name" maxlength="60" placeholder="Наприклад, Дім або Робота"></label><label class="field">Підчерга<select name="queue">'+queueOptions(queues,'1.1')+'</select></label><p class="muted">Графік Хмельницької області. Відключення за конкретним будинком перевіряються через «Додати адресу».</p><button class="wide primary">Зберегти</button></form>')}
async function refreshAddress(item){
  if(!item.streetId)return;
  try{
    const data=await api('/api/address?street='+encodeURIComponent(item.streetId)+'&house='+encodeURIComponent(item.house));
    if(!addresses.some(address=>address.id===item.id))return;
    addressData.set(item.id,data);addressErrors.delete(item.id);persistAddressSnapshots();
  }catch(error){addressErrors.set(item.id,error.message)}
}
async function refresh(){
  if(refreshing)return;
  refreshing=true;render();
  const tasks=[(async()=>{try{const next=await api('/api/schedules');const changes=diffSchedules(schedule,next);if(changes.length){scheduleChanges=changes;scheduleChangedAt=next.fetchedAt}schedule=next;scheduleFromCache=false;sourceError='';persistScheduleSnapshot()}catch(error){sourceError=error.message}render()})()];
  // Sequential address batches keep the upstream request load bounded.
  tasks.push((async()=>{for(const item of [...addresses]){await refreshAddress(item)}})());
  await Promise.all(tasks);
  refreshing=false;render();
}
document.addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');if(!button)return;
  const {action,id}=button.dataset;
  switch(action){
    case 'schedule-changes':openScheduleChanges();break;
    case 'acknowledge-changes':scheduleChanges=[];scheduleChangedAt=null;persistScheduleSnapshot();dialog.close();render();break;
    case 'fuel-next':nextFuel();break;
    case 'fuel-info':showFuelInfo();break;
    case 'fuel-refresh':await refreshFuel();showFuelInfo();break;
    case 'light-tab':pageMode='light';render();break;
    case 'safety-tab':pageMode='safety';render();await refreshTelegram();break;
    case 'safety-info':openDialog('Про стрічку','<p class="muted">Показуємо відібрані текстові дописи місцевого неофіційного каналу за останні 30 хвилин. Перевіряємо оновлення щохвилини, поки цей розділ відкритий.</p><p class="muted">Відбір за словами й контекстом може помилятися або пропускати повідомлення. Статус тривоги показано в окремій картці з посиланням на джерело. Ubilling — сторонній сервіс, його обласний статус не підтверджує відсутності місцевих тривог. Якщо джерело недоступне або дані застарілі, картка не показує відбій. Порожня стрічка не означає відбій або відсутність загрози. Час за Києвом.</p><button class="wide primary" data-action="close">Зрозуміло</button>');break;
    case 'telegram-refresh':await refreshTelegram();break;
    case 'detail':showAddress(id);break;
    case 'back':showAddress(null);break;
    case 'date':selectedDate=button.dataset.date;render();break;
    case 'refresh':await refresh();break;
    case 'theme':{const theme=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;try{localStorage.setItem('zvitlo-theme',theme)}catch{}render();app.querySelector('.theme').focus();break}
    case 'add':openAddress();break;
    case 'install':installHelp();break;
    case 'queue':if(dialog.open)dialog.close();openQueue();break;
    case 'choose-settlement':await chooseSettlement(button);break;
    case 'choose-street':await chooseStreet(button);break;
    case 'remove':openDialog('Видалити адресу?','<p class="muted">Ця картка зникне з твого списку.</p><button class="wide" type="button" data-action="confirm-remove" data-id="'+escapeHtml(id)+'">Видалити</button>');break;
    case 'confirm-remove':addresses=addresses.filter(item=>item.id!==id);addressData.delete(id);addressErrors.delete(id);persist();dialog.close();showAddress(null);break;
    case 'close':dialog.close();formRevision++;break;
  }
});
dialog.addEventListener('close',()=>{formRevision++;clearTimeout(searchTimer)});
document.addEventListener('input',event=>{
  if(event.target.form?.id!=='address-form')return;
  if(['settlement','street'].includes(event.target.name))search(event.target.name,event.target);
  if(event.target.name==='name')event.target.setCustomValidity('');
});
document.addEventListener('change',async event=>{
  if(event.target.form?.id==='address-form'&&event.target.name==='house'){await loadHouse();return}
  const field=event.target.dataset.field;
  if(field==='date'){selectedDate=event.target.value;render();return}
  if(!field)return;
  const item=addresses.find(item=>item.id===selected);if(!item)return;
  if(field==='name')item.name=event.target.value.trim()||item.name;
  if(field==='queue')item.queue=event.target.value;
  persist();render();
});
document.addEventListener('submit',async event=>{
  if(!['address-form','queue-form'].includes(event.target.id))return;
  event.preventDefault();
  const f=event.target,data=new FormData(f);
  const name=data.get('name').trim()||(f.id==='address-form'?f.dataset.streetText+', '+data.get('house'):'Підчерга '+data.get('queue'));
  const item={id:crypto.randomUUID(),name,queue:data.get('queue')};
  if(!queues.includes(item.queue))return;
  if(f.id==='address-form'){
    if(!lookup||!f.dataset.street)return;
    Object.assign(item,{settlementId:f.dataset.settlement,settlementText:f.dataset.settlementText,streetId:f.dataset.street,streetText:f.dataset.streetText,house:data.get('house')});
    addressData.set(item.id,lookup);
  }
  addresses.push(item);persist();persistAddressSnapshots();dialog.close();showAddress(item.id);
});
app.addEventListener('touchstart',event=>{if(event.target.closest('#hours'))swipeStart=event.changedTouches[0]},{passive:true});
app.addEventListener('touchcancel',()=>{swipeStart=null},{passive:true});
app.addEventListener('touchend',event=>{if(!swipeStart)return;const end=event.changedTouches[0],dx=end.clientX-swipeStart.clientX,dy=end.clientY-swipeStart.clientY;swipeStart=null;if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.5)return;const index=addresses.findIndex(item=>item.id===selected),next=addresses[index+(dx<0?1:-1)];if(next)showAddress(next.id)},{passive:true});
setInterval(()=>{if(!document.hidden)refresh()},300000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();refreshAirRaid();refreshFuel();if(pageMode==='safety')refreshTelegram()}});
setInterval(()=>{if(!document.hidden&&pageMode==='safety'&&!selected)refreshTelegram()},60000);
setInterval(()=>{const minute=currentLocal();if(minute===lastMinute)return;lastMinute=minute;if(!dialog.open&&!['INPUT','SELECT'].includes(document.activeElement?.tagName)){if(schedule&&schedule.today!==today())refresh();else render()}},10000);
setInterval(()=>{app.querySelectorAll('[data-next]').forEach(el=>el.textContent=countdown(Number(el.dataset.next)))},1000);

document.addEventListener('pointerdown',event=>{
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const button=event.target.closest('button');
  if(!button||button.disabled||event.button!==0)return;
  button.querySelectorAll('.touch-wave').forEach(wave=>wave.remove());
  const rect=button.getBoundingClientRect(),size=Math.max(rect.width,rect.height)*2;
  const wave=document.createElement('span');wave.className='touch-wave';wave.setAttribute('aria-hidden','true');
  Object.assign(wave.style,{width:size+'px',height:size+'px',left:(event.clientX-rect.left-size/2)+'px',top:(event.clientY-rect.top-size/2)+'px'});
  button.append(wave);wave.addEventListener('animationend',()=>wave.remove(),{once:true});
},{passive:true});

render();refresh();refreshAirRaid();refreshFuel();setupOfflineShell();
window.addEventListener('online',()=>{refresh();refreshAirRaid();refreshFuel();if(pageMode==='safety')refreshTelegram()});
window.addEventListener('offline',()=>{airRaidData={status:'unknown'};fuelError='Немає інтернету';telegramError='Немає інтернету';render()});
setInterval(()=>{if(!document.hidden)refreshAirRaid()},30000);
setInterval(()=>{if(!document.hidden)refreshFuel()},900000);
setInterval(()=>{if(!document.hidden&&!dialog.open&&!selected&&document.activeElement?.closest('#fuel-widget')==null)nextFuel()},8000);
</script>
</body>
</html>
